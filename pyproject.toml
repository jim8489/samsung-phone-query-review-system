[project]
name = "samsung-phone-query-review"
version = "1.4.0"
description = "Samsung phone scraper, RAG chatbot, specialist agents and FastAPI service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
