services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: samsung_phones
      POSTGRES_USER: samsung_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samsung_app -d samsung_phones"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://samsung_app:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/samsung_phones
      SEED_DEMO_DATA: "false"
      LLM_PROVIDER: "auto"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      AGENT_FRAMEWORK: "langchain"
      SCRAPER_DELAY_SECONDS: "3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
